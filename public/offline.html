<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2545" />
    <title>CivicRewards — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0b2545;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 32px 24px;
        background: rgba(255, 255, 255, 0.04);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border: 2px solid #c9971c;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { font-size: 14px; opacity: 0.8; margin-bottom: 20px; line-height: 1.5; }
      button {
        background: #fff;
        color: #0b2545;
        border: none;
        font-size: 14px;
        font-weight: 700;
        padding: 12px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">CR</div>
      <h1>You're offline</h1>
      <p>CivicRewards needs a connection to load live ward data. Your installed app will pick up right where you left off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
